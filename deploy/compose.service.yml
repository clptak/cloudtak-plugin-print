# Paste into your docker-compose.yml services block.
#
# The build context is relative to the compose file, which assumes this repository
# is cloned beside your CloudTAK checkout in the stack directory:
#
#   ~/tak-stack/
#   ├── docker-compose.yml
#   ├── CloudTAK/
#   └── cloudtak-plugin-print/
#
# A stack that addresses its checkouts absolutely can substitute its own
# convention -- for example ${HOME_DIRECTORY_PATH}/tak-stack/... -- as long as the
# path ends at this repository's service/ directory.
#
# Port 5010, not 5003 — cloudtak-events already publishes 5003.
#
# `env_file: .env` is load-bearing: the service derives the PUBLIC hostnames from
# CloudTAK's own API_URL and PMTILES_URL. Do NOT set API_URL here — overriding it
# with an internal address makes every CloudTAK source in a style look like a
# stranger's and get dropped. Use API_INTERNAL_URL for that.
#
# During testing, swap `expose` for `ports: ["127.0.0.1:5010:5010"]` so curl on
# the host can reach it. A service whose job is to fetch URLs and render them must
# never be published on 0.0.0.0.

  cloudtak-print:
    container_name: cloudtak-print
    build:
      context: ./cloudtak-plugin-print/service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - cloudtak-api
      - cloudtak-tiles
      - cloudtak-store
    expose:
      - "5010"
    # Docker's 64MB /dev/shm default crashes Chromium on large canvases.
    shm_size: '1gb'
    env_file: .env
    environment:
      # Internal addresses only. API_URL and PMTILES_URL arrive from .env and are
      # the public URLs the style documents actually contain.
      - API_INTERNAL_URL=http://cloudtak-api:5000
      - TILES_INTERNAL_URL=http://cloudtak-tiles:5002
      - PRINT_CONCURRENCY=${PRINT_CONCURRENCY:-1}
      - PRINT_RENDER_TIMEOUT_SECONDS=${PRINT_RENDER_TIMEOUT_SECONDS:-180}
      - PRINT_MAX_DPI=${PRINT_MAX_DPI:-200}
      - PRINT_LAYOUT_DPI=${PRINT_LAYOUT_DPI:-96}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5010/print-api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # SwiftShader is CPU-bound and parallelises, so this is the single
          # biggest lever on render time: 2.0 cores made a full sheet take four
          # times longer than the same work on a less constrained machine.
          #
          # The default of 4 is chosen for an 8-core host — half the machine for a
          # job that runs one at a time and is not latency-critical, leaving the
          # other half for TAK Server and the API. Raise PRINT_CPUS on a bigger
          # box; do not hardcode a number that would consume a small one.
          cpus: '${PRINT_CPUS:-4.0}'
          memory: ${PRINT_MEMORY:-4G}
